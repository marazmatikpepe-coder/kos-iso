# Glass effect, tuned for Intel Atom. If it lags: blur-method = "none".
backend = "glx"; vsync = true;
blur-method = "dual_kawase"; blur-strength = 3;
corner-radius = 18;
shadow = true; shadow-radius = 22; shadow-opacity = 0.35; shadow-offset-x = -12; shadow-offset-y = -8;
fading = true; fade-in-step = 0.06; fade-out-step = 0.06;
inactive-opacity = 0.92; frame-opacity = 0.85;
opacity-rule = [ "82:class_g = 'Plank'", "88:class_g = 'Xfce4-panel'", "90:class_g = 'Thunar'" ];
